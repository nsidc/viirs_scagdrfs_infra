radiative_forcing:
  datatype: u2
  _FillValue: 65535US
  long_name: VIIRSDRFS radiative forcing on snow
  standard_name: surface_downward_heat_flux_in_snow
  units: W m-2
  valid_range:
    datatype: u2
    values: [0, 500]
  comment: Additional energy absorbed by the snowpack from light-absorbing impurities assuming a clear sky
  grid_mapping: crs
  ancillary_variables: DRFS_data_mask

unmasked_radiative_forcing:
  datatype: u2
  _FillValue: 255
  long_name: Unmasked VIIRSDRFS radiative forcing on snow
  standard_name: surface_downward_heat_flux_in_snow
  units: W m-2
  valid_range:
    datatype: u2
    values: [0, 500]
  comment: Unmasked, additional energy absorbed by the snowpack from light-absorbing impurities assuming a clear sky
  grid_mapping: crs

drfs_grnsz:
  datatype: u2
  _FillValue: 255
  long_name: VIIRSDRFS grain size
  standard_name: snow_grain_size
  units: m
  valid_range:
    datatype: u2
    values: [10, 1100]
  add_offset: 0.0
  scale_factor: 0.000001
  comment: Optical snow grain size based on VIIRSDRFS normalized difference grain size index
  grid_mapping: crs
  ancillary_variables: DRFS_data_mask

unmasked_drfs_grnsz:
  datatype: u2
  _FillValue: 255
  long_name: Unmasked VIIRSDRFS grain size
  standard_name: snow_grain_size
  units: m
  valid_range:
    datatype: u2
    values: [10, 1100]
  add_offset: 0.0
  scale_factor: 0.000001
  comment: Unmasked, optical snow grain size based on VIIRSDRFS normalized difference grain size index
  grid_mapping: crs

deltavis:
  datatype: u2
  _FillValue: 255
  long_name: VIIRSDRFS decrease in snow albedo from light absorbing particles
  units: "1"
  valid_range:
    datatype: u2
    values: [0, 75]
  add_offset: 0.0
  scale_factor: 0.01
  comment: Also known as snow darkening. Difference between observed visible broadband (0.350-0.876 micrometer) albedo and clean snow albedo estimated from VIIRSDRFS grain size
  grid_mapping: crs
  ancillary_variables: DRFS_data_mask

unmasked_deltavis:
  datatype: u2
  _FillValue: 255
  long_name: Unmasked VIIRSDRFS decrease in snow albedo from light absorbing particles
  units: "1"
  valid_range:
    datatype: u2
    values: [0, 75]
  add_offset: 0.0
  scale_factor: 0.01
  comment: Also known as snow darkening. Unmasked difference between observed visible broadband (0.350-0.876 micrometer) albedo and clean snow albedo estimated from VIIRSDRFS grain size
  grid_mapping: crs

DRFS_data_mask:
  datatype: u2
  _FillValue: 0
  long_name: flag values for masked DRFS data
  standard_name: status_flag
  units: "1"
  valid_range:
    datatype: u2
    values: [235, 255]
  grid_mapping: crs
  flag_values:
    datatype: u2
    values: [235, 250, 255]
  flag_meanings: value_not_calculated cloud no_input_data
