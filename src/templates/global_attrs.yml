title: >-
  Near Real-Time MODIS/Terra L3 Global Daily 500m SIN Grid Snow Cover, Grain
  Size, and Dust Radiative Forcing
Conventions: CF-1.11, ACDD-1.3
source: http://doi.org/10.5067/MODIS/MOD09GA.NRT.061
standard_name_vocabulary: CF Standard Name Table (v86, 04 September 2024)
summary: >-
  The MODIS Snow Covered Area and Grain-size (MODSCAG) and MODIS Dust Radiative
  Forcing in Snow (MODDRFS) data are derived from near real-time MODIS/Terra
  surface reflectance data (MOD09GA_NRT) and include the following parameters:
  snow fraction, snow grain size (from the SCAG algorithm), vegetation fraction,
  rock fraction, ice fraction, shade fraction, deltavis, radiative forcing, and
  optical snow grain size (from the DRFS algorithm).
comment: >-
  This data is based on the MODIS Snow Covered Area and Grain-size (MODSCAG) and
  MODIS Dust Radiative Forcing in Snow (MODDRFS) data sets previously produced by
  the NASA Jet Propulsion Laboratory (JPL).
references: >-
  Painter, T.H., Rittger, K., McKenzie, C., Slaughter, P., Davis, R.E., & Dozier,
  J. (2009). Retrieval of subpixel snow-covered area, grain size, and albedo from
  MODIS. Remote Sensing of Environment, 113, 868-879, doi: 10.1016/j.rse.2009.01.001.
  Painter, T.H., Bryant, A.C., & Skiles, S.M. (2012). Radiative forcing by light
  absorbing impurities in snow from MODIS surface reflectance data. Geophysical
  Research Letters, 39, L17502, doi: 10.1029/2012gl052457
