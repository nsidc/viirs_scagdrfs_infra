# Per-product metadata for SCAGDRFS netCDF global attributes.
# These values fill the placeholders in scagdrfs_template.cdl.
# Keys match placeholder names exactly.

MOD09GA:
  title: "Near Real-Time MODIS/Terra L3 Global Daily 500m SIN Grid Snow Cover, Grain Size, and Dust Radiative Forcing"
  source: "http://doi.org/10.5067/MODIS/MOD09GA.NRT.061"
  platform: "Terra"
  instrument: "MODIS > Moderate-Resolution Imaging Spectroradiometer"
  summary: >
    The MODIS Snow Covered Area and Grain-size (MODSCAG) and MODIS Dust Radiative Forcing in Snow
    (MODDRFS) data are derived from near real-time MODIS/Terra surface reflectance data (MOD09GA_NRT)
    and include the following parameters: snow fraction, snow grain size (from the SCAG algorithm),
    vegetation fraction, rock fraction, ice fraction, shade fraction, deltavis, radiative forcing,
    and optical snow grain size (from the DRFS algorithm).
  comment: >
    This data is based on the MODIS Snow Covered Area and Grain-size (MODSCAG) and MODIS Dust
    Radiative Forcing in Snow (MODDRFS) data sets previously produced by the NASA Jet Propulsion
    Laboratory (JPL).
  citation: >
    Rittger, K., Brodzik, M. J., Hardman, M. A., Wilcox, H., Scott, D. J., Marowitz, R., & Painter, T.
    (2024). Near Real-Time MODIS/Terra L3 Global Daily 500m SIN Grid Snow Cover, Grain Size, and Dust
    Radiative Forcing, Version 1 [Data Set]. Boulder, Colorado USA. NASA National Snow and Ice Data
    Center Distributed Active Archive Center. https://doi.org/10.5067/5OTQIAWI04ZT. [Data Accessed].
  contributor_name: >-
    Karl Rittger, Mary J. Brodzik, Molly A. Hardman, Hannah Wilcox, Donna J. Scott,
    Robyn Marowitz, Jessica Calme, Sebastien J. P. Lenard, Ken Mankoff, Annie Burgess
  contributor_role: >-
    principal_investigator, science_programmer, science_programmer,
    software_developer, project_lead, software_developer, data_manager,
    postdoc_researcher, science_programmer, researcher
  doi: "10.5067/5OTQIAWI04ZT"
  product_version: "v1.1"
  source_id: "MOD09GANRT061"
  nc_filename_version: "V01.1"
  software_version_id: "0.0.1"

