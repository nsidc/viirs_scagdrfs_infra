# ubyte snow_fraction(time,y,x)
snow_fraction:
  datatype: u1
  long_name: MODSCAG viewable snow fraction
  standard_name: snow_area_fraction_viewable_from_above
  units: '1'
  _FillValue: 255
  valid_range:
    datatype: u1
    values:
      - 0
      - 100
  grid_mapping: crs
  add_offset:
    datatype: f4
    values:
      - 0
  scale_factor:
    datatype: f4
    values:
      - 0.01
  ancillary_variables: SCAG_data_mask

# ubyte unmasked_snow_fraction(time,y,x)
unmasked_snow_fraction:
  datatype: u1
  long_name: Unmasked MODSCAG viewable snow fraction
  standard_name: snow_area_fraction_viewable_from_above
  units: '1'
  _FillValue: 255
  valid_range:
    datatype: u1
    values:
      - 0
      - 100
  grid_mapping: crs
  add_offset:
    datatype: f4
    values:
      - 0.0
  scale_factor:
    datatype: f4
    values:
      - 0.01

# ushort grain_size(time,y,x)
grain_size:
  datatype: u2
  long_name: MODSCAG grain size
  standard_name: snow_grain_size
  units: m
  _FillValue: 65535
  valid_range:
    datatype: u2
    values:
      - 10
      - 1100
  comment: Optical snow grain size based on MODSCAG spectral mixture analysis
  grid_mapping: crs
  add_offset:
    datatype: f4
    values:
      - 0.0
  scale_factor:
    datatype: f4
    values:
      - 0.000001
  ancillary_variables: SCAG_data_mask

# ushort unmasked_grain_size(time,y,x)
unmasked_grain_size:
  datatype: u2
  long_name: Unmasked MODSCAG grain size
  standard_name: snow_grain_size
  units: m
  _FillValue: 65535
  valid_range:
    datatype: u2
    values:
      - 10
      - 1100
  comment: >-
    Unmasked optical snow grain size based on MODSCAG spectral mixture analysis
  grid_mapping: crs
  add_offset:
    datatype: f4
    values:
      - 0.0
  scale_factor:
    datatype: f4
    values:
      - 0.000001

