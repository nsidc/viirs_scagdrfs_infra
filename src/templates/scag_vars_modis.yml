# ubyte SCAG_data_mask(time, y, x)
SCAG_data_mask:
  datatype: u1
  dimensions:  (time, y, x,)
  long_name: flag values for masked SCAG data
  standard_name: status_flag
  units: '1'
  _FillValue: 0
  valid_range:
    datatype: u1
    values:
      - 235
      - 255
  grid_mapping: crs
  flag_values:
    datatype: u1
    values:
      - 235
      - 245
      - 250
      - 255
  flag_meanings: value_not_calculated snow_area_fraction_viewable_from_above_less_than_0.15 cloud no_input_data
